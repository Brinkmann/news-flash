name: Daily news flash

# Runs entirely on GitHub's servers. Nothing local.
on:
  schedule:
    # GitHub cron is UTC and best-effort: observed delays on this repo were
    # 73 minutes (2026-08-02) and 94 minutes (2026-08-03), so the buffer must
    # absorb roughly two hours. 16:25 UTC = 04:25 NZST nominal; even a
    # two-hour delay publishes before the 06:30 listen. (Odd minute chosen:
    # on-the-hour and half-hour slots are the most congested.)
    - cron: "25 16 * * *"
  workflow_dispatch: {}   # manual dispatch for controlled testing

permissions:
  contents: write

concurrency:
  # Never let two runs publish at once, and never queue a second paid run.
  group: daily-news-flash
  cancel-in-progress: false

jobs:
  build-flash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install anthropic requests piper-tts
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: voice
          key: piper-en_GB-alba-medium-v1

      - name: Download the voice model if not cached
        run: |
          mkdir -p voice
          if [ ! -f voice/en_GB-alba-medium.onnx ]; then
            curl -sL -o voice/en_GB-alba-medium.onnx \
              https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/alba/medium/en_GB-alba-medium.onnx
            curl -sL -o voice/en_GB-alba-medium.onnx.json \
              https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/alba/medium/en_GB-alba-medium.onnx.json
          fi

      # --- EDITORIAL: the only paid step. One call, no retries, no tools. ---
      - name: Produce the flash (editorial step)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -u make_flash.py

      # --- Build audio to a DATED file, never straight to the served name. ---
      - name: Make the MP3
        run: |
          DATE=$(TZ='Pacific/Auckland' date +%Y-%m-%d)
          piper --model voice/en_GB-alba-medium.onnx \
                --output_file "flash-$DATE.wav" < flash.txt
          ffmpeg -y -v error -i "flash-$DATE.wav" \
                 -codec:a libmp3lame -b:a 128k "flash-$DATE.mp3"
          rm -f "flash-$DATE.wav"

      # --- GATE: nothing is published unless the audio validates. ---
      - name: Validate the MP3
        run: |
          DATE=$(TZ='Pacific/Auckland' date +%Y-%m-%d)
          python validate_mp3.py "flash-$DATE.mp3" flash.txt

      # --- Only now does the served file change. Atomic promotion. ---
      - name: Publish
        run: |
          DATE=$(TZ='Pacific/Auckland' date +%Y-%m-%d)
          mkdir -p archive
          cp flash.json "archive/$DATE.json"
          cp flash.txt  "archive/$DATE.txt"
          cp "flash-$DATE.mp3" flash.mp3          # promote to the served URL
          git config user.name  "flash-bot"
          git config user.email "flash-bot@users.noreply.github.com"
          git add flash.mp3 flash.json flash.txt last_run_sources.json \
                  "archive/$DATE.json" "archive/$DATE.txt"
          git commit -m "Flash for $DATE" || echo "No changes"
          git push
          rm -f "flash-$DATE.mp3"

      # --- If anything above failed, the LISTENER must not hear stale news. ---
      # A status file alone is not protection: VoiceMonkey fetches flash.mp3
      # and plays whatever is there. So the audio itself is replaced with a
      # recorded notice. This is the "clearly controlled unavailable-today
      # response" the specification requires.
      - name: Serve the unavailable notice on failure
        if: failure()
        run: |
          set -x
          DATE=$(TZ='Pacific/Auckland' date +%Y-%m-%d)

          git config user.name  "flash-bot"
          git config user.email "flash-bot@users.noreply.github.com"

          # A tracked archive entry for today means a run already published
          # successfully. A later failed run (e.g. a manual re-dispatch) must
          # not replace today's good flash with the unavailable notice.
          if git ls-files --error-unmatch "archive/$DATE.json" >/dev/null 2>&1; then
            # Discard anything a partial run left in the working tree so the
            # served files stay exactly as the successful run published them.
            git checkout -- flash.mp3 flash.txt flash.json 2>/dev/null || true
            printf '%s\n' \
              '{' \
              "  \"date\": \"$DATE\"," \
              '  "status": "failed_after_publish",' \
              '  "note": "A later run failed today. The flash published earlier today remains live."' \
              '}' > flash-status.json
            git add flash-status.json
            git commit -m "Run FAILED for $DATE after successful publish - flash left in place" \
              || echo "No changes to commit"
            git push
            exit 0
          fi

          if [ ! -f flash-unavailable.mp3 ]; then
            echo "FATAL: flash-unavailable.mp3 missing from the repo."
            echo "Stale audio is still being served. Fix this immediately."
            exit 1
          fi

          cp flash-unavailable.mp3 flash.mp3

          # Neutralise the text records too. flash.txt and flash.json sit at
          # fixed URLs (and flash.json feeds the parked Flash Briefing path),
          # so they must not keep presenting old text as current.
          printf '%s\n' "Today's news flash is unavailable. End of flash." > flash.txt
          printf '%s\n' \
            '[' \
            '  {' \
            "    \"uid\": \"flash-$DATE-unavailable\"," \
            "    \"updateDate\": \"${DATE}T06:30:00.0Z\"," \
            "    \"titleText\": \"Daily Flash unavailable, $DATE\"," \
            '    "mainText": "Today'"'"'s flash was not produced. This is a controlled unavailable notice, not stale news.",' \
            '    "redirectionUrl": "https://brinkmann.github.io/news-flash/flash.mp3"' \
            '  }' \
            ']' > flash.json

          printf '%s\n' \
            '{' \
            "  \"date\": \"$DATE\"," \
            '  "status": "failed",' \
            '  "note": "Today'"'"'s flash was not produced. flash.mp3, flash.txt and flash.json now serve the unavailable notice, not stale news."' \
            '}' > flash-status.json

          git add flash.mp3 flash.txt flash.json flash-status.json
          git commit -m "Flash FAILED for $DATE - serving unavailable notice" \
            || echo "No changes to commit"
          git push
